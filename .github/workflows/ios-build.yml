name: iPhone build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'StreamBrowser/**'
      - 'StreamBrowser.xcodeproj/**'
      - 'Tests/**'
      - 'scripts/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build:
    # Same runner and Xcode as ios-screenshots.yml, so the installed binary and the
    # simulator-verified binary come from one toolchain (iOS 18.5 SDK).
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate media policy, recovery and build unsigned IPA
        run: bash scripts/build-ios.sh
        env:
          # Distinguishes installed builds; shown in Settings as 버전 x.y.z (N).
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: StreamBrowser-unsigned-${{ github.event_name }}-${{ github.sha }}
          path: |
            build/StreamBrowser-unsigned.ipa
            build/StreamBrowser-unsigned.ipa.sha256
            build/StreamBrowser-build.txt
          if-no-files-found: error
          retention-days: 7
