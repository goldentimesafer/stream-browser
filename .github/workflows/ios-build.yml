name: iPhone build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'StreamBrowser/**'
      - 'StreamBrowser.xcodeproj/**'
      - 'Tests/**'
      - 'scripts/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate media policy, recovery and build unsigned IPA
        run: bash scripts/build-ios.sh
        env:
          # Distinguishes installed builds; shown in Settings as 버전 x.y.z (N).
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: StreamBrowser-unsigned
          path: build/StreamBrowser-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
