name: iPhone screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the simulator app and UI tests
        run: |
          mkdir -p build
          simulator=$(xcrun simctl list devices available --json | jq -er '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]
            | map(select(.name == "iPhone 16")) | first | .udid
          ')
          xcrun simctl boot "$simulator"
          echo "SCREEN_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcodebuild -project StreamBrowser.xcodeproj -scheme StreamBrowser \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$simulator" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath build/SimulatorBuild \
            -parallel-testing-enabled NO build-for-testing
      - name: Capture the first launch directly
        run: |
          mkdir -p build/screenshots
          xcrun simctl bootstatus "$SCREEN_SIMULATOR" -b
          xcrun simctl install "$SCREEN_SIMULATOR" build/SimulatorBuild/Build/Products/Debug-iphonesimulator/StreamBrowser.app
          xcrun simctl launch "$SCREEN_SIMULATOR" local.streambrowser.ios
          sleep 8
          xcrun simctl io "$SCREEN_SIMULATOR" screenshot build/screenshots/startup.png
          xcrun simctl terminate "$SCREEN_SIMULATOR" local.streambrowser.ios
      - name: Navigate the app and capture its screens
        run: |
          xcodebuild -project StreamBrowser.xcodeproj -scheme StreamBrowser \
            -destination "platform=iOS Simulator,id=$SCREEN_SIMULATOR" \
            -derivedDataPath build/SimulatorBuild \
            -parallel-testing-enabled NO -resultBundlePath build/Screenshots.xcresult \
            -only-testing:StreamBrowserUITests/ScreenCaptureTests test-without-building
      - name: Export screenshots as PNG files
        if: ${{ !cancelled() && hashFiles('build/Screenshots.xcresult/Info.plist') != '' }}
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/Screenshots.xcresult --output-path build/attachments
          missing=0
          for name in 01-lock 02-browser 03-library 04-settings 05-download diagnostic-lock; do
            if file=$(jq -er --arg name "$name" '
              [.[].attachments[] | select(.suggestedHumanReadableName | startswith($name))
                | .exportedFileName | select(endswith(".png"))] | first
            ' build/attachments/manifest.json); then
              cp "build/attachments/$file" "build/screenshots/$name.png"
            elif [[ "$name" != diagnostic-lock ]]; then
              echo "::error::Missing $name screenshot"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('build/screenshots/*.png') != '' }}
        with:
          name: StreamBrowser-screenshots
          path: build/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
