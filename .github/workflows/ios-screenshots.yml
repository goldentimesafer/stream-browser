name: iPhone screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'StreamBrowser/**'
      - 'StreamBrowser.xcodeproj/**'
      - 'Tests/**'
      - '.github/workflows/ios-screenshots.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the simulator app and UI tests
        run: |
          mkdir -p build
          simulator=$(xcrun simctl list devices available --json | jq -er '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]
            | map(select(.name == "iPhone 16")) | first | .udid
          ')
          xcrun simctl boot "$simulator"
          echo "SCREEN_SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcodebuild -project StreamBrowser.xcodeproj -scheme StreamBrowser \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$simulator" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath build/SimulatorBuild \
            -parallel-testing-enabled NO build-for-testing
      - name: Check lock with existing-install preferences
        run: |
          xcrun simctl bootstatus "$SCREEN_SIMULATOR" -b
          bundle=local.streambrowser.ios
          xcrun simctl install "$SCREEN_SIMULATOR" build/SimulatorBuild/Build/Products/Debug-iphonesimulator/StreamBrowser.app
          container=$(xcrun simctl get_app_container "$SCREEN_SIMULATOR" "$bundle" data)
          mkdir -p "$container/Library/Preferences"
          preferences="$container/Library/Preferences/$bundle.plist"
          plutil -create xml1 "$preferences"
          plutil -insert appLockEnabled -bool YES "$preferences"
          xcodebuild -project StreamBrowser.xcodeproj -scheme StreamBrowser \
            -destination "platform=iOS Simulator,id=$SCREEN_SIMULATOR" \
            -derivedDataPath build/SimulatorBuild -parallel-testing-enabled NO \
            -resultBundlePath build/ExistingLock.xcresult \
            -only-testing:StreamBrowserUITests/ScreenCaptureTests/testExistingInstallKeepsLock test-without-building
          xcrun simctl uninstall "$SCREEN_SIMULATOR" "$bundle"
      - name: Capture the first launch directly
        run: |
          mkdir -p build/screenshots
          xcrun simctl bootstatus "$SCREEN_SIMULATOR" -b
          xcrun simctl install "$SCREEN_SIMULATOR" build/SimulatorBuild/Build/Products/Debug-iphonesimulator/StreamBrowser.app
          xcrun simctl launch "$SCREEN_SIMULATOR" local.streambrowser.ios
          sleep 8
          xcrun simctl io "$SCREEN_SIMULATOR" screenshot build/screenshots/startup.png
          xcrun simctl terminate "$SCREEN_SIMULATOR" local.streambrowser.ios || true
      - name: Navigate the app and capture its screens
        run: |
          xcodebuild -project StreamBrowser.xcodeproj -scheme StreamBrowser \
            -destination "platform=iOS Simulator,id=$SCREEN_SIMULATOR" \
            -derivedDataPath build/SimulatorBuild \
            -parallel-testing-enabled NO -resultBundlePath build/Screenshots.xcresult \
            -only-testing:StreamBrowserUITests/ScreenCaptureTests/testCaptureMainScreens test-without-building
      - name: Export screenshots as PNG files
        if: ${{ !cancelled() && hashFiles('build/Screenshots.xcresult/Info.plist') != '' }}
        run: |
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/Screenshots.xcresult --output-path build/attachments
          missing=0
          for name in 00-welcome 01-lock 02-browser 03-library 04-settings 05-download diagnostic-lock; do
            if file=$(jq -er --arg name "$name" '
              [.[].attachments[] | select(.suggestedHumanReadableName | startswith($name))
                | .exportedFileName | select(endswith(".png"))] | first
            ' build/attachments/manifest.json); then
              cp "build/attachments/$file" "build/screenshots/$name.png"
            elif [[ "$name" != diagnostic-lock ]]; then
              echo "::error::Missing $name screenshot"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() && hashFiles('build/screenshots/*.png') != '' }}
        with:
          name: StreamBrowser-screenshots
          path: build/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Collect simulator launch diagnostics
        if: always()
        run: |
          mkdir -p build/diagnostics
          if [[ -n "${SCREEN_SIMULATOR:-}" ]]; then
            xcrun simctl spawn "$SCREEN_SIMULATOR" log show --last 15m --style compact \
              --predicate 'process == "StreamBrowser"' > build/diagnostics/app.log 2>&1 || true
          fi
          if [[ -f build/ExistingLock.xcresult/Info.plist ]]; then
            xcrun xcresulttool get test-results summary --path build/ExistingLock.xcresult \
              > build/diagnostics/existing-lock.json || true
          fi
          for folder in "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Developer/CoreSimulator/Devices/${SCREEN_SIMULATOR:-missing}/data/Library/Logs/CrashReporter"; do
            if [[ -d "$folder" ]]; then
              find "$folder" -type f -name 'StreamBrowser*' -exec cp {} build/diagnostics/ \;
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: StreamBrowser-simulator-diagnostics
          path: build/diagnostics/
          if-no-files-found: warn
          retention-days: 7
